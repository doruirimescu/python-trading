# S&P 500 scan: which weighted baskets (<= 3 names, long-only) trace the cleanest, longest-lived
# uptrend / downtrend / range ending today?
config_version: 1
name: sp500
universe:
  lists: [sp500]            # add more lists here: [sp500, us_sector_etfs, country_etfs, cross_asset_etfs]
data:
  source: yfinance
  end: null                 # null = latest bar; set YYYY-MM-DD to replay a past date
  years: 11
  cache_dir: data_cache
  max_age_days: 1
search:
  shapes: [uptrend, downtrend, range]
  windows: [63, 126, 252, 378, 504, 756, 1008, 1260, 1512, 2016, 2520]
  holdout_bars: 21
  long_only: true
  max_assets: 3
  max_weight: 0.7
  min_weight: 0.05
  seeds: 25
  min_improvement: 0.01
scoring:
  space: log
  threshold: 0.6
  min_annual_return: 0.10
  min_range_height: 0.10
  max_range_drift: 0.5
  complexity_penalty: 0.02
ranking:
  top_n: 30
  require_alive: true
  max_overlap: 0.5
  max_per_member: 2
