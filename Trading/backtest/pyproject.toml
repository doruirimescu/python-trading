[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelab"
version = "0.1.0"
description = "Generic leakage-safe backtesting framework (intraday-first, daily-capable)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "pydantic>=2",
  "pyyaml>=6",
  "plotly>=5.20",
  "pyarrow>=15",
  "yfinance>=0.2.40",
  "databento>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
fast = ["numba>=0.59"]

[project.scripts]
tradelab = "tradelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradelab = ["data/instruments.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not network and not perf'"
markers = [
  "network: needs internet / API keys (skipped by default)",
  "perf: performance benchmarks (run with -m perf)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E731", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
