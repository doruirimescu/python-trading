config_version: 1
name: example_mnq_orb_synthetic
data:
  source: synthetic          # real: source: parquet, options: {path: data_store/databento/MNQ_1m.parquet, preset: databento_ohlcv_1m}
  symbols: [MNQ]
  start: "2023-01-03"
  end: "2023-12-29"
  freq: 5m
  base_freq: 1m
  session: rth
  options: {seed: 7, bid_ask: true}
strategy:
  name: orb_intraday
  params: {or_minutes: 30, rr: 2.0, risk_pct: 0.005}
  warmup_sessions: 20
  grid: {or_minutes: [15, 30, 60], rr: [1.5, 2.0, 2.5, 3.0]}
execution:
  fill: next_open
  slippage_ticks: 1
  stop_extra_slippage_ticks: 1
  flatten_at: "15:55"
  session_flat: true
  risk:
    trade_window: ["10:00", "15:00"]
    max_trades_per_day: 1
    stop_after_consecutive_losses: 2
initial_capital: 50000
seed: 1
robustness:
  bootstrap_n: 1000
  mc_n: 1000
  cost_mults: [0, 1, 2, 3]
  objective: sharpe
  n_jobs: 2
  walkforward: {is_len: 120, oos_len: 40, scheme: rolling, purge: 1}
analytics: {periods_per_year: 252}
